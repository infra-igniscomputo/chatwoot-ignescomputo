# Imagem do Chatwoot da Ignes Computo (edição comunitária, arm64) no GitHub Container Registry.
# Baseado no publish_foss_docker.yml do Chatwoot, que foi removido junto com os outros workflows do original
# (eles publicam no Docker Hub da Chatwoot Inc. e dependem dos segredos de lá).
#   - push na branch ignescomputo: publica :ignescomputo e :v<versão>-ignes-<sha curto>;
#   - PR: só constrói, para conferir;
#   - workflow_dispatch: publica a partir do ref escolhido.
# Só arm64: a máquina da demo (repo ignes-empresa) é Graviton. Sem segredo: o login no GHCR usa o GITHUB_TOKEN.
name: Imagem (GHCR, arm64)

on:
  push:
    branches: [ignescomputo]
    paths-ignore: ['**.md']
  pull_request:
    branches: [ignescomputo]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imagem-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGEM: ghcr.io/infra-igniscomputo/chatwoot-ignescomputo

jobs:
  imagem:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Sem código enterprise (licença comercial)
        run: |
          rm -rf enterprise spec/enterprise
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - name: Tags
        id: tags
        run: |
          versao="v$(jq -r .version package.json)-ignes-$(git rev-parse --short=7 HEAD)"
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          echo "lista=${IMAGEM}:ignescomputo,${IMAGEM}:${versao}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (e push fora de PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.lista }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=chatwoot-ignescomputo
            org.opencontainers.image.description=Chatwoot (edição comunitária) da Ignes Computo
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.tags.outputs.versao }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: |
          echo "### Imagem" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.tags.outputs.lista }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "(PR: só construída, não publicada)" >> "$GITHUB_STEP_SUMMARY"
          fi
